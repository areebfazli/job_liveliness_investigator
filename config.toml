# Role-Liveness Investigator — configuration
#
# All values in this file are PLACEHOLDERS for M0 (skeleton milestone).
# They are not tuned on any data yet. Per spec.md §5, the action policy
# thresholds must be tuned once on development/temporal-validation data
# and then frozen (see `[policy].frozen_at`) before final evaluation.
#
# Loaded by rli.config.load_config, which resolves this file relative to the
# repo root (not the process CWD). An installed-package deployment has no
# repo root and must set $RLI_CONFIG instead.
#
# Every table below is validated with `extra = "forbid"`: an unrecognized key
# is a hard error, not a silently ignored line.

[thresholds]
# Default recheck interval (days) when no declared expiry exists.
# spec.md §1: recheck_after_days = min(recheck_cap_days,
# days_until_validThrough) if a declared expiry exists, else this default.
recheck_default_days = 14

# Upper bound on recheck_after_days when a declared expiry (validThrough)
# exists. spec.md §1 writes this rule as `min(14, days_until_validThrough)`;
# the `14` is configuration, not a literal in the policy code.
recheck_cap_days = 14

# Max number of dynamic (non-mandatory) probe steps the agent loop may take.
# spec.md §4: "Start with at most 4 dynamic probe steps."
max_dynamic_steps = 4

# A posting's publish evidence is considered "recent" if its age in days is
# <= this value. Used to populate the `publish_recency` policy input.
# PLACEHOLDER — not yet tuned.
recent_publish_days = 14

# A posting/board history is considered "long-lived" if its observed history
# span in days is >= this value. Used for the repost + long-lived branch of
# the action policy (spec.md §5). PLACEHOLDER — not yet tuned.
long_lived_days = 180

# Minimum observed board-history span (days) before rli.history.features
# will express an opinion on a history-derived policy input such as
# `repost_pattern`. Below this, the feature is the UNKNOWN sentinel, never a
# guessed value — spec.md §4: "missing history never means flat hiring".
# PLACEHOLDER — not yet tuned.
min_history_days = 30

# Lookback window (days), counted back from `as_of`, within which a
# `company_events` row can still populate the `material_negative_event` /
# `freeze_or_pause` policy inputs (spec.md §5). PLACEHOLDER — not yet tuned.
negative_event_window_days = 180

[matching]
# Repost/version matching (spec.md §4: "Match reposted/versioned roles using
# title, team, location, and description similarity. Keep thresholds
# configurable and validate match precision on a hand-checked sample of 50
# matches."). This table is AUTHORITATIVE for rli.history.matching and
# rli.history.features; it supersedes the older [thresholds].repost_* keys
# above, which are now unread by any code path and are kept only so an
# existing config keeps loading. Everything here is a PLACEHOLDER pending
# the hand-checked 50-match precision validation.

# --- similarity gates -------------------------------------------------------
# Mandatory minimum on the title component (title is the only component
# guaranteed to be present, so it is always a hard gate).
title_min = 0.85
# Stricter bar used when title is the ONLY component known for both sides —
# with no team, location or description hash to corroborate it, a merely
# "similar" title is not evidence of a repost. Two unrelated "Software
# Engineer" postings would otherwise link at 1.0.
title_only_min = 0.95
# Per-component minimums that count as INDEPENDENT corroboration. At least
# one must be met (on a component known for both sides) before a link is
# accepted; they are not vetoes, so "same role reposted with a broadened
# location" still matches on team or description.
team_min = 0.80
location_min = 0.90
description_min = 0.80
# Minimum weighted-mean similarity over the KNOWN components. At 0.70 a role
# reposted with the same title/team/location but a changed description is
# still linked (the "changed repost" case spec.md §5 needs), while a
# similar-title/different-team/different-location near miss is not.
combined_min = 0.70

# --- temporal gates ---------------------------------------------------------
# Maximum days from the old posting's `first_seen_absent` to the candidate's
# `first_observed`.
max_gap_days = 120
# How far BEFORE the old posting's first observed absence the candidate may
# already have been live and still count as its repost. Captures are sparse,
# so a repost can legitimately first appear inside the censoring interval
# `(last_seen_open, first_seen_absent]`; this bounds how far into it a match
# may reach. 0.0 would also reject the very common archive case of a single
# capture that shows the old job gone and the new job present.
pre_absence_tolerance_days = 7.0

# --- title quality (shared with the rli.archive HTML extractor) -------------
# Minimum normalized length for a string to be accepted as a job title. Junk
# link text ("Apply", "View") is rejected by rli.history.titles both at
# extraction time and at match time.
junk_title_min_chars = 3
# A scraped board page whose most common title covers more than this fraction
# of its jobs is an extraction failure, not a board where every role has the
# same name: the jobs are dropped and the capture is recorded as
# coverage_status='partial' (a coverage gap, never an absence).
page_shared_title_max_fraction = 0.60
# Below this many jobs the fraction above is arithmetically meaningless
# (1 of 1 job is always 100%), so it is not applied.
page_shared_title_min_jobs = 3

[budgets]
# Maximum USD cost allowed for a single investigation run (LLM + paid probes).
# PLACEHOLDER.
max_cost_usd = 0.50

# Maximum wall-clock latency (seconds) allowed for a single investigation run.
# PLACEHOLDER.
max_latency_s = 60.0

# HTTP behaviour for rli.net (spec.md §2: "Structured probe failure ... no
# uncontrolled retry loops"; spec.md §4: "per-host rate limits with
# exponential backoff"). These are deliberately config, not call-site
# defaults, so retry behaviour is auditable in one place.
[net]
# Retries AFTER the initial attempt, so total attempts = max_retries + 1.
# 0 means "attempt once, never retry".
max_retries = 3

# First backoff step (seconds). Delay ceiling for attempt n is
# min(max_backoff_s, backoff_base_s * 2**n); full jitter is applied to it.
backoff_base_s = 0.5

# Hard ceiling (seconds) on any single backoff sleep, including a value
# taken from a `Retry-After` response header. Must be >= backoff_base_s.
max_backoff_s = 30.0

# Per-request httpx timeout (seconds), so a hung host cannot consume the
# run's latency budget (see [budgets].max_latency_s).
timeout_s = 20.0

# Maximum redirect hops followed. rli.net follows redirects manually and
# re-checks the allowlist on every hop, so this bounds an attacker-supplied
# redirect chain.
max_redirects = 5

# Token-bucket defaults applied to any host without an explicit
# [rate_limits."<host>"] entry below. Deliberately conservative: an
# unlisted host is, by definition, one whose published limits we have not
# checked (this includes every employer career page reached by json_ld).
default_requests_per_second = 1.0
default_burst = 3

# Per-host rate limits used by rli.net. Keys are hostnames. Values are
# placeholders — must be checked against each host's documented/observed
# rate limits before live collection scales up. Hosts not listed here fall
# back to [net].default_requests_per_second / default_burst.

# Greenhouse Job Board API (spec.md §3/§10: documented public API,
# first_published / updated_at -> ats_native).
[rate_limits."boards-api.greenhouse.io"]
requests_per_second = 1.0
burst = 3

# Ashby Public Job Postings API (spec.md §3/§10: publishedAt -> ats_native).
[rate_limits."api.ashbyhq.com"]
requests_per_second = 1.0
burst = 3

# Lever Postings API (spec.md §3: public current postings; undocumented date
# fields are NOT trusted as ATS-native publish dates).
[rate_limits."api.lever.co"]
requests_per_second = 1.0
burst = 3

# Human-facing board pages, used for canonical URL resolution and JSON-LD.
[rate_limits."boards.greenhouse.io"]
requests_per_second = 1.0
burst = 3

[rate_limits."jobs.ashbyhq.com"]
requests_per_second = 1.0
burst = 3

[rate_limits."jobs.lever.co"]
requests_per_second = 1.0
burst = 3

# Wayback (spec.md §4: "Snapshot and Wayback CDX jobs use per-host rate
# limits with exponential backoff"). Kept deliberately conservative — a
# throttled capture is recorded as a coverage gap, never as an absence, so
# being throttled costs us history rather than producing a wrong answer.
[rate_limits."web.archive.org"]
requests_per_second = 0.5
burst = 2

# Per-probe domain allowlists (spec.md §2: "Enforce per-probe network-domain
# allowlists."). Each key is a probe name; the value is the list of hostnames
# that probe is permitted to contact. Entries are matched EXACTLY against the
# normalized host by rli.net.check_allowed — a suffix match is not enough, so
# `evilboards.greenhouse.io` is rejected by the entry `boards.greenhouse.io`.
# Wildcard subdomain entries (`*.greenhouse.io`) are deliberately unsupported;
# the only special entry is the bare `"*"` used by json_ld below.
[allowlists]
# Resolver + board snapshot reach both the documented ATS APIs (the source of
# ats_native publish dates) and the corresponding human-facing board pages
# (canonical URL resolution and the JSON-LD fallback).
resolve_posting = [
    "boards-api.greenhouse.io",
    "api.ashbyhq.com",
    "api.lever.co",
    "boards.greenhouse.io",
    "jobs.ashbyhq.com",
    "jobs.lever.co",
]
board_snapshot = [
    "boards-api.greenhouse.io",
    "api.ashbyhq.com",
    "api.lever.co",
    "boards.greenhouse.io",
    "jobs.ashbyhq.com",
    "jobs.lever.co",
]

# History probes read only the archive (spec.md §3: "Wayback: archive
# fallback/history only; always record capture coverage").
repost_history = ["web.archive.org"]

# requirements_drift additionally fetches the CURRENT job content via the
# posting's own ATS adapter (to diff against the earliest archived capture),
# so its allowlist adds the documented ATS API hosts alongside web.archive.org.
requirements_drift = [
    "web.archive.org",
    "boards-api.greenhouse.io",
    "api.ashbyhq.com",
    "api.lever.co",
]

# rli/archive backfill (M1 PLAN bullet 4): Wayback CDX + capture fetch.
archive_backfill = ["web.archive.org"]

# spec.md §3: JSON-LD `JobPosting.datePosted` -> page_structured. It is read
# from arbitrary employer career pages, which cannot be enumerated in
# advance, so any host is allowed here — but only over https, and
# rli.net.check_allowed still rejects userinfo in the URL, IP literals
# (v4/v6, including private / loopback / link-local / reserved ranges) and
# non-public single-label or internal-suffix hosts before any request is
# made.
json_ld = ["*"]

# Not implemented yet (spec.md §4). Empty list = this probe may contact no
# host at all, which is the correct fail-closed state for an unimplemented
# probe.
company_events = []
team_signal = []

[policy]
# Timestamp (ISO 8601, UTC) at which the v1 action policy thresholds were
# frozen for final evaluation (spec.md §5). TOML has no null literal, so the
# key is left unset here; rli.config.Policy defaults `frozen_at` to None
# ("not yet frozen"). Do not set this manually outside of that freeze
# process (planned for M3) — when set, it must carry an explicit UTC offset
# (`2026-01-01T00:00:00Z`); a naive TOML datetime is rejected, since it
# cannot be placed on the point-in-time replay timeline (spec.md §3/§6).
# frozen_at = 2026-01-01T00:00:00Z

# spec.md §5: "Terms such as `recent`, `long-lived`, and `material negative
# event` are configuration with documented frozen thresholds." This table is
# where the ACTION POLICY's thresholds are frozen. They are read through
# `rli.policy.action.PolicyThresholds`, never as literals in the policy code,
# and they are part of `policy_version()` — changing any value here changes
# the recorded policy version, exactly as changing the policy source does.

# Two `first_published` claims from DIFFERENT sources that disagree by more
# than this many days are a material contradiction, which forces
# `evidence_quality` to "mixed" (spec.md §1). Set above zero because
# `ats_native` and `page_structured` dates legitimately differ by a day or
# two (timezone/rendering lag), and that is not a conflict.
# PLACEHOLDER — not yet tuned.
contradiction_days = 3

# The four keys below are OVERRIDES of the identically named [thresholds]
# keys, not copies: when unset (the default), the policy reads the
# [thresholds] value, so there is exactly one source of truth. Set one here
# only to pin the POLICY's notion of a term at freeze time (spec.md §5)
# independently of the history/feature layer that shares the name.
# recent_publish_days = 14
# long_lived_days = 180
# recheck_default_days = 14
# recheck_cap_days = 14

# Numeric cost tiers + rough latency estimates for the dynamic probes
# (spec.md §4 "Dynamic probes" cost column; PLAN.md M3). rli.probes.registry
# reads these to rank eligible candidates and check them against
# [budgets].max_cost_usd / max_latency_s. PLACEHOLDERS pending measurement
# from real probe runs.
[probe_costs]
low = 1
medium = 3
high = 10
latency_low_s = 2.0
latency_medium_s = 5.0
latency_high_s = 12.0

# spec.md §4: team_signal has "no licensed enrichment source" yet
# (rli.probes.team_signal.NullTeamSignalSource). `enabled = false` keeps it
# out of rli.probes.registry.eligible_probes entirely until a real source is
# wired in; corroborating_hiring_signal stays UNKNOWN until then.
[team_signal]
enabled = false

# spec.md §2: "one structured-output-capable LLM API" (spec.md §7), with LLM
# outputs cached by `(model_id, prompt_hash, structured_input_hash)` for exact
# benchmark replay. `model_id` below is part of that cache key, so changing it
# does NOT silently reuse the previous model's answers.
[llm]
# Anthropic model id used by System C's investigator and explanation calls.
model_id = "claude-sonnet-5"

# Per-call output cap. Both System C prompts return a small structured object,
# so this is a guard against a runaway generation, not a target length.
max_tokens = 4096

# Per-request timeout (seconds) handed to the Anthropic SDK client. Kept well
# under [budgets].max_latency_s so a single hung call cannot silently consume
# the whole run's latency budget.
timeout_s = 60.0

# Transport-level retries of ONE API call, applied by the SDK
# (spec.md §2: "no uncontrolled retry loops"). This is unrelated to
# [agent].max_probe_retries, which retries a failed PROBE.
max_retries = 2

# Price table used ONLY for cost accounting — these numbers are never sent to
# the API and never enter a prompt or cache key, so editing them re-prices
# future runs without invalidating any cached model output. Rates are list
# price per MILLION tokens. A model id absent from this table costs 0.0 and
# does not raise (rli.config.Llm.price_for): an unpriced model must produce a
# wrong number rather than no answer, since this table is accounting, not a
# safety control.
[llm.prices."claude-sonnet-5"]
input_usd_per_mtok = 2.0
output_usd_per_mtok = 10.0

[llm.prices."claude-opus-5"]
input_usd_per_mtok = 5.0
output_usd_per_mtok = 25.0

[llm.prices."claude-haiku-4-5"]
input_usd_per_mtok = 1.0
output_usd_per_mtok = 5.0

# System C (LLM investigator + deterministic controller, spec.md §4/§6;
# PLAN.md M5). spec.md §2: "Never rely on the LLM alone for budgets,
# probabilities, stopping, permissions, or the final action" — every cap in
# this table is enforced by the controller, never by the model.
[agent]
# The three caps below are OVERRIDES of [budgets].max_cost_usd,
# [budgets].max_latency_s and [thresholds].max_dynamic_steps, not copies:
# unset (the default) means "inherit", so there is exactly one source of
# truth. This is the same convention the [policy] overrides above use. Set
# one here only to run System C under a different cap than the shared one
# (a cheap smoke run, say) without moving the budget A and B are measured
# against.
# max_cost_usd = 0.50
# max_latency_s = 60.0
# max_dynamic_steps = 4

# Retries of a RETRYABLE structured probe failure inside one agent step.
# One, deliberately: spec.md §2 forbids uncontrolled retry loops, and a
# second attempt at the same probe with the same arguments is already the
# last one worth paying for. 0 disables retrying.
max_probe_retries = 1

# --- ranking cost model -----------------------------------------------------
# These four convert [probe_costs]' unitless cost POINTS and a probe's latency
# estimate into one dollar-denominated number, so the controller's value/cost
# ranking and the run's budget ledger share a single unit. All PLACEHOLDERS,
# unmeasured: they encode a preference ordering (a `high`-tier probe should
# look about 10x a `low`-tier one), not a measured price. Do not read the
# resulting figure as a cost forecast.
#
# Dollars charged per unit of a probe's estimated wall-clock latency, so a
# slow probe is penalized in the same unit as an expensive one.
latency_cost_usd_per_s = 0.002
# Assumed probability that any given probe fails outright. Uniform across
# probes because no per-probe failure rate has been measured yet.
failure_rate_placeholder = 0.1
# Dollars charged for that expected failure (the wasted step).
failure_cost_usd = 0.01
# Dollars per [probe_costs] cost point.
probe_cost_usd_per_point = 0.002

# --- prompt shaping ---------------------------------------------------------
# Truncation applied to an untrusted `raw_excerpt` before it is placed in an
# <untrusted source="..."> block in the investigator prompt (spec.md §2:
# "Treat job pages/news as untrusted data; delimit them in prompts"). Bounds
# both the token bill and how much attacker-controlled text one evidence item
# can inject. 0 means "no excerpt text reaches the prompt at all".
max_excerpt_chars = 400

# Upper bound on how many proposed probe candidates the controller will even
# look at; extras are rejected with a recorded reason, never silently
# truncated. The investigator is untrusted for control flow, so the length of
# its candidate list must not be able to drive the controller's work.
max_candidates = 8

# Optional learned probe ranker (C2). Removed if it does not beat deterministic
# ranking on held-out replay data (spec.md §4).
[ranker]
min_rows = 200
test_fraction = 0.25
min_auc_gain = 0.05
min_accuracy_gain = 0.0
seed = 20260607
max_iter = 1000
c = 1.0
